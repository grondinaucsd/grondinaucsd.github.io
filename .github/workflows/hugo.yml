name: Build CV and Hugo site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.108.0
      HUGO_ENVIRONMENT: production
      HUGO_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Hugo and LaTeX
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
            --output "$RUNNER_TEMP/hugo.deb"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$RUNNER_TEMP/hugo.deb" texlive-latex-extra texlive-fonts-recommended
      - name: Compile CV from LaTeX
        run: bash scripts/build_cv.sh
      - name: Build website
        run: hugo --minify --baseURL "https://giacomorondina.org/"
      - name: Check CV publication and source exclusions
        run: |
          cmp content/static/cv.pdf public/static/cv.pdf
          test ! -e public/cv/RondinaCV.tex
          test ! -e public/maintenance/SETUP.md
      - name: Report internal link findings
        # Advisory while the existing issues in INITIAL_AUDIT.md are resolved.
        run: python3 scripts/audit_site.py public
      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: website-review-${{ github.run_id }}
          path: |
            public/
            build/cv/RondinaCV.pdf
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
